<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Corm;font-weight:600;src:url(node_modules/@fontsource/cormorant/files/cormorant-cyrillic-600-normal.woff2)}
@font-face{font-family:Corm;font-weight:700;src:url(node_modules/@fontsource/cormorant/files/cormorant-cyrillic-700-normal.woff2)}
@font-face{font-family:Corm;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/cormorant/files/cormorant-cyrillic-700-italic.woff2)}
@font-face{font-family:Man;font-weight:400;src:url(node_modules/@fontsource/manrope/files/manrope-cyrillic-400-normal.woff2)}
@font-face{font-family:Man;font-weight:600;src:url(node_modules/@fontsource/manrope/files/manrope-cyrillic-600-normal.woff2)}
@font-face{font-family:Man;font-weight:800;src:url(node_modules/@fontsource/manrope/files/manrope-cyrillic-800-normal.woff2)}
@font-face{font-family:Cav;src:url(node_modules/@fontsource/caveat/files/caveat-cyrillic-600-normal.woff2)}
@font-face{font-family:Cour;src:url(node_modules/@fontsource/courier-prime/files/courier-prime-latin-400-normal.woff2)}
html,body{margin:0;padding:0}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;color:#3b2a20;
 background:radial-gradient(ellipse at 30% 25%,#f6f2ec 0%,#efe8df 55%,#e7ddd0 100%)}
.top{position:absolute;left:96px;top:96px;right:96px;display:flex;align-items:center;gap:22px;
 font-family:Man;font-weight:600;font-size:26px;letter-spacing:9px;text-transform:uppercase;color:#9a6a35}
.top i{flex:1;height:1.5px;background:linear-gradient(90deg,#c08a45,rgba(192,138,69,0))}
.jup{position:absolute;right:60px;top:40px}
.star{position:absolute;color:#c08a45;font-family:Man;font-size:34px}
.content{position:absolute;left:96px;top:380px;width:880px}
.date{font-family:Corm;font-weight:700;font-size:150px;line-height:.95;text-transform:uppercase;letter-spacing:2px;
 background:linear-gradient(180deg,#d9a45c,#b47835 55%,#8a5623);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 6px rgba(120,80,40,.18))}
.dash{width:120px;height:3px;background:#c08a45;margin:34px 0 38px}
.moon{font-family:Corm;font-weight:700;font-size:84px;line-height:1;color:#2a1a12;display:flex;align-items:center}
.badges{margin-top:52px;max-width:860px}
.lead{margin-top:46px;max-width:820px;font-family:Man;font-weight:400;font-size:44px;line-height:1.3;color:#3b2a20}
.badge{display:inline-block;margin:0 16px 20px 0;padding:16px 30px 14px;border:2px solid #c08a45;border-radius:40px;background:rgba(255,255,255,.35);
 font-family:Man;font-weight:600;font-size:30px;letter-spacing:3px;text-transform:uppercase;color:#7a4e22}
.badge i{font-style:normal;color:#a7703a}
.note{font-family:Cav;font-size:66px;line-height:1.05;color:#a7703a;margin:48px 0 0 4px;max-width:760px}
.swash{width:280px;height:22px;margin:6px 0 0 8px}
.acc{position:absolute;left:96px;bottom:70px;font-family:Cour;font-size:30px;letter-spacing:1px;color:#9a6a35}
.nick{position:absolute;right:96px;bottom:70px;font-family:Cour;font-size:30px;letter-spacing:1px;color:#9a6a35}
</style></head>
<body>
<div class="c">
  <div class="top">астропрогноз<i></i></div>
  <svg class="jup" width="250" height="250" viewBox="0 0 300 300">
    <defs>
      <radialGradient id="jg" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#f6d79a"/><stop offset=".5" stop-color="#c98b45"/><stop offset="1" stop-color="#6e4120"/></radialGradient>
      <clipPath id="jc"><circle cx="150" cy="150" r="62"/></clipPath>
    </defs>
    <ellipse cx="150" cy="150" rx="135" ry="44" fill="none" stroke="#c08a45" stroke-width="1.6" opacity=".8" transform="rotate(-18 150 150)"/>
    <circle cx="150" cy="150" r="62" fill="url(#jg)"/>
    <g clip-path="url(#jc)" opacity=".35" stroke="#5a3418" stroke-width="7" fill="none">
      <path d="M80 128 Q150 118 220 128"/><path d="M80 152 Q150 144 220 152"/><path d="M80 176 Q150 170 220 176"/>
    </g>
    <circle cx="263" cy="112" r="6" fill="#c08a45"/>
  </svg>
  <div class="star" style="left:900px;top:640px">✦</div>
  <div class="star" style="left:120px;top:1150px;font-size:26px">✦</div>
  <div class="content">
    <div class="date">{{DATE}}</div>
    <div class="dash"></div>
    <div class="moon">{{MOON}}</div>
    <div class="lead">{{FOOTER}}</div>
    <div class="note">{{NOTE}}</div>
    <svg class="swash" viewBox="0 0 280 22"><path d="M4 14 Q80 2 150 12 T276 8" stroke="#c08a45" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="acc">@annetbo_</div>
  <div class="nick">@karta.udachi</div>
</div>
</body></html>
