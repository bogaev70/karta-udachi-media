<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:GV;src:url(node_modules/@fontsource/great-vibes/files/great-vibes-cyrillic-400-normal.woff2)}
@font-face{font-family:GVL;src:url(node_modules/@fontsource/great-vibes/files/great-vibes-latin-400-normal.woff2)}
@font-face{font-family:Corm;font-weight:600;src:url(node_modules/@fontsource/cormorant/files/cormorant-cyrillic-600-normal.woff2)}
@font-face{font-family:Corm;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/cormorant/files/cormorant-cyrillic-700-italic.woff2)}
@font-face{font-family:Corm;font-weight:700;src:url(node_modules/@fontsource/cormorant/files/cormorant-cyrillic-700-normal.woff2)}
@font-face{font-family:Cav;src:url(node_modules/@fontsource/caveat/files/caveat-cyrillic-600-normal.woff2)}
@font-face{font-family:Cour;src:url(node_modules/@fontsource/courier-prime/files/courier-prime-latin-400-normal.woff2)}
html,body{margin:0;padding:0}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;
 background:#F6DEDB;}
.c::after{content:"";position:absolute;inset:0;
 background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,.025) 2px 4px),
  radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.25),transparent 60%),
  radial-gradient(ellipse at 85% 95%,rgba(80,30,50,.18),transparent 55%);pointer-events:none}
.under{position:absolute;left:150px;top:255px;width:780px;height:860px;background:#FBF6EC;
 transform:rotate(3.5deg);box-shadow:0 18px 40px rgba(60,20,30,.25);
 background-image:repeating-linear-gradient(0deg,transparent 0 47px,#C9D6E3 47px 49px);}
.sheet{position:absolute;left:130px;top:220px;width:820px;height:880px;background-color:#FFFDF8;
 background-image:linear-gradient(#D7E3EE 1.5px,transparent 1.5px),linear-gradient(90deg,#D7E3EE 1.5px,transparent 1.5px);
 background-size:40px 40px;transform:rotate(-2deg);
 box-shadow:0 22px 50px rgba(60,20,30,.30);
 clip-path:polygon(0 1.5%,4% 0,9% 1.2%,15% .2%,22% 1.4%,29% .3%,36% 1.1%,43% 0,51% 1.3%,58% .2%,66% 1.2%,73% .1%,80% 1.4%,87% .3%,93% 1.2%,100% .4%,100% 100%,0 100%);}
.tape{position:absolute;width:230px;height:62px;background:rgba(246,222,219,.82);
 box-shadow:0 2px 6px rgba(0,0,0,.1);z-index:5}
.content{position:absolute;left:190px;top:300px;width:700px;transform:rotate(-2deg);z-index:4;color:#2B1B12}
.note{font-family:Cav;font-size:54px;color:#8E4A6E;margin:0 0 6px 4px}
.title{font-family:Corm;font-weight:700;font-style:italic;font-size:84px;line-height:1.0;color:#8E4A6E;
 text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:10px;margin:10px 0 0}
.script{font-family:GV;font-size:150px;line-height:.9;color:#2B1B12;margin:46px 0 0 30px}
.text{font-family:Corm;font-weight:600;font-size:52px;line-height:1.05;margin:56px 0 0;max-width:620px}
.star{position:absolute;z-index:6}
.seal{position:absolute;right:120px;top:930px;width:150px;height:150px;border-radius:50%;z-index:6;
 background:radial-gradient(circle at 38% 34%,#F2B6C4,#D97F9A 45%,#B3557A 80%);
 box-shadow:0 8px 18px rgba(80,20,40,.35),inset -6px -8px 14px rgba(90,20,50,.35),inset 6px 6px 12px rgba(255,255,255,.35);
 transform:rotate(12deg)}
.seal::before{content:"";position:absolute;inset:26px;border-radius:50%;border:4px solid rgba(255,230,236,.55)}
.seal span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:GVL;font-size:64px;color:rgba(255,236,240,.9)}
.hand{position:absolute;left:96px;bottom:118px;font-family:Cav;font-size:62px;color:#8E4A6E;transform:rotate(-4deg);text-shadow:0 2px 6px rgba(90,30,50,.3);z-index:7}
.nick{position:absolute;right:70px;bottom:58px;font-family:Cour;font-size:30px;color:#8E4A6E;letter-spacing:1px;z-index:7}
.bub{display:inline-block;padding:22px 30px 18px;background:#E9E3EE;border-radius:34px 34px 34px 8px;font-family:Corm;font-weight:600;font-size:46px;line-height:1.05;color:#2B1B12;box-shadow:0 6px 14px rgba(60,20,30,.15)}
.bub .who{font-family:Cav;font-size:34px;color:#8E4A6E;margin-bottom:6px}
.row{font-family:Corm;font-weight:600;font-size:56px;line-height:1.05;margin:0 0 26px}
.row b{font-family:Corm;font-weight:700;font-style:italic;color:#8E4A6E;text-decoration:underline;text-underline-offset:8px}
.cav{font-family:Cav;color:#8E4A6E}
.sign{display:inline-block;margin:120px 0 0 120px;padding:26px 56px;border:5px solid #8E4A6E;border-radius:18px;font-family:Corm;font-weight:700;font-size:92px;letter-spacing:6px;color:#8E4A6E;background:#FBEFF2;transform:rotate(-4deg);position:relative;box-shadow:0 8px 18px rgba(60,20,30,.15)}
.sign::before{content:"";position:absolute;left:50%;top:-74px;width:150px;height:80px;margin-left:-75px;border:4px solid #8a7f88;border-bottom:none;border-radius:80px 80px 0 0}
.stamp{display:inline-block;margin:40px 0 0 60px;padding:20px 40px;border:6px double #8E4A6E;border-radius:14px;font-family:Corm;font-weight:700;font-size:70px;letter-spacing:3px;color:#8E4A6E;transform:rotate(-7deg);opacity:.9}
.abc{display:flex;gap:56px;margin-top:50px}.abc div{text-align:center;font-family:Corm;font-weight:600;font-size:50px;line-height:1.05}.abc span{display:block;font-family:Corm;font-weight:700;font-style:italic;font-size:130px;color:#8E4A6E;line-height:1.05}
.strike{text-decoration:line-through;text-decoration-thickness:3px;opacity:.7}
.badge{display:inline-block;margin:0 14px 18px 0;padding:14px 26px;border-radius:40px;background:#F6DEDB;border:2px solid #C49AA6;font-family:Corm;font-weight:700;font-size:44px;color:#2B1B12}
.badge i{font-style:normal;color:#8E4A6E}
.acc{position:absolute;left:96px;bottom:58px;font-family:Cour;font-size:30px;letter-spacing:1px;color:#8E4A6E;z-index:7}
.hearts{position:absolute;left:830px;top:150px;font-family:Cav;font-size:70px;color:#8E4A6E;transform:rotate(14deg);z-index:7}
</style></head>
<body>
<div class="c">
  <div class="under"></div>
  <div class="sheet"></div>
  <div class="tape" style="left:420px;top:190px;transform:rotate(-6deg)"></div>
  <div class="content"><div class="note">астропрогноз</div>
<div class="script" style="margin:0 0 0 0;font-size:132px">{{DATE}}</div>
<div class="title" style="margin-top:40px;font-size:96px">{{MOON}}</div>
<div style="margin-top:56px">{{BADGES}}</div>
<div class="cav" style="font-size:58px;margin:40px 0 0 120px;transform:rotate(-4deg)">{{NOTE}}</div></div>
  <svg class="star" style="left:96px;top:150px;transform:rotate(-14deg)" width="150" height="150" viewBox="0 0 100 100">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".45" stop-color="#E2B24A"/><stop offset="1" stop-color="#9C6B17"/></linearGradient></defs>
    <polygon points="50,4 62,36 96,38 69,59 79,93 50,73 21,93 31,59 4,38 38,36" fill="url(#g)" stroke="#8a5d12" stroke-width="1.5"/>
    <polygon points="50,4 62,36 50,50" fill="rgba(255,255,255,.35)"/>
  </svg>
  <div class="seal"><span>K</span></div>
  <div class="hearts">♡ ♡</div>
  
  <div class="acc">@annetbo_</div>
  <div class="nick">@karta.udachi</div>
</div>
</body></html>
